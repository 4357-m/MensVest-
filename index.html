
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MensVest - Seu Guarda-Roupa Virtual</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f5f5f5; text-align: center; }
    header { background: #111; color: white; padding: 20px; font-size: 24px; font-weight: bold; }
   .btn { background: #111; color: white; padding: 15px 30px; border: none; border-radius: 12px; font-size: 16px; margin: 10px; cursor: pointer; }
   .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
   .item { background: white; border-radius: 12px; padding: 10px; }
   .item img { width: 100%; border-radius: 8px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>MensVest</header>

  <div style="padding: 20px;">
    <h2>Seu Guarda-Roupa Virtual</h2>
    <label for="fileInput" class="btn">+ Adicionar Roupa</label>
    <input type="file" id="fileInput" accept="image/*" capture="camera">
    <button class="btn" onclick="montarLook()">Montar Look</button>
  </div>

  <div class="grid" id="guardaRoupa"></div>

  <script>
    let roupas = JSON.parse(localStorage.getItem('mensvest')) || [];

    function salvar() {
      localStorage.setItem('mensvest', JSON.stringify(roupas));
      mostrarRoupas();
    }

    function mostrarRoupas() {
      const grid = document.getElementById('guardaRoupa');
      grid.innerHTML = roupas.map((r, i) => `
        <div class="item">
          <img src="${r}">
          <button onclick="remover(${i})">Remover</button>
        </div>
      `).join('');
    }

    document.getElementById('fileInput').onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        roupas.push(reader.result);
        salvar();
      }
      reader.readAsDataURL(file);
    }

    function remover(i) {
      roupas.splice(i, 1);
      salvar();
    }

    function montarLook() {
      if(roupas.length < 2) return alert('Adiciona pelo menos 2 roupas primeiro!');
      let look = roupas.sort(() => 0.5 - Math.random()).slice(0, 3);
      alert('Seu Look de Hoje:\\n' + look.length + ' peças combinadas! \\nAbra seu guarda-roupa e veja as sugestões.');
    }

    mostrarRoupas();
  </script>
</body>
</html>
