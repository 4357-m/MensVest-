<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MensVest - Seu Estilista IA</title>
<style>
body { font-family: Arial; background: #111; color: #fff; text-align: center; padding: 20px; }
.btn { background: #333; color: #fff; border: none; padding: 12px 20px; margin: 5px; border-radius: 8px; cursor: pointer; }
.btn-pro { background: linear-gradient(90deg, #FFD700, #FFA500); color: #000; font-weight: bold; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.grid img { width: 100%; border-radius: 8px; background: #222; }
.loader { display: none; }
select { width: 100%; margin-top: 5px; background: #333; color: #fff; border: none; padding: 5px; border-radius: 5px; }
</style>
</head>
<body>

<h1>MensVest 👔</h1>

<h2>Seu Guarda-Roupa Virtual</h2>
<input type="file" id="galeria" accept="image/*" style="display:none">
<input type="file" id="camera" accept="image/*" capture="camera" style="display:none">
<input type="file" id="armario" accept="image/*" multiple style="display:none">

<button class="btn" onclick="document.getElementById('camera').click()">📸 Foto Individual</button>
<button class="btn" onclick="document.getElementById('galeria').click()">🖼️ Da Galeria</button>
<button class="btn-pro" onclick="document.getElementById('armario').click()">🧠 Foto do Armário</button>

<div class="loader" id="loader">Recortando roupas...</div>

<h3>Qual a ocasião?</h3>
<select id="ocasiao">
  <option value="casual">😎 Casual</option>
  <option value="trabalho">💼 Trabalho</option>
  <option value="festa">🎉 Festa</option>
  <option value="esporte">🏃 Esporte</option>
</select>

<button class="btn-pro" onclick="montarLookInteligente()">✨ Montar Look Inteligente</button>

<div id="areaLook"></div>
<div class="grid" id="guardaRoupa"></div>

<script>
const REMOVE_BG_KEY = '13ELAgTUNrotLEoVNNphngKm'; // SUA CHAVE
let roupas = JSON.parse(localStorage.getItem('mensVestRoupas')) || [];

function salvar() {
    localStorage.setItem('mensVestRoupas', JSON.stringify(roupas));
    carregarGuardaRoupa();
}

async function recortarRoupa(file) {
    document.getElementById('loader').style.display = 'block';
    let formData = new FormData();
    formData.append('image_file', file);
    formData.append('size', 'auto');

    let res = await fetch('https://api.remove.bg/v1.0/removebg', {
        method: 'POST',
        headers: { 'X-Api-Key': REMOVE_BG_KEY },
        body: formData
    });
    let blob = await res.blob();
    document.getElementById('loader').style.display = 'none';
    return URL.createObjectURL(blob);
}

// FOTO DO ARMÁRIO - SEM POPUP
document.getElementById('armario').onchange = async (e) => {
    for(let file of e.target.files) {
        let urlRecortada = await recortarRoupa(file);
        roupas.push({src: urlRecortada, categoria: 'peca', id: Date.now() + Math.random()});
    }
    salvar();
    alert('Peças adicionadas! Defina o tipo no Guarda-Roupa')
}

// FOTO INDIVIDUAL
document.getElementById('camera').onchange = document.getElementById('galeria').onchange = async (e) => {
    let file = e.target.files[0];
    let urlRecortada = await recortarRoupa(file);
    roupas.push({src: urlRecortada, categoria: 'peca', id: Date.now()});
    salvar();
}

function editarTipo(id, novoTipo) {
    const roupa = roupas.find(r => r.id === id);
    if(roupa) roupa.categoria = novoTipo;
    salvar();
}

function carregarGuardaRoupa() {
    const grid = document.getElementById('guardaRoupa');
    grid.innerHTML = roupas.map(r => `
        <div>
            <img src="${r.src}">
            <select onchange="editarTipo(${r.id}, this.value)">
                <option ${r.categoria=='camisa'?'selected':''} value="camisa">Camisa</option>
                <option ${r.categoria=='calca'?'selected':''} value="calca">Calça</option>
                <option ${r.categoria=='sapato'?'selected':''} value="sapato">Sapato</option>
                <option ${r.categoria=='peca'?'selected':''} value="peca">Outro</option>
            </select>
        </div>
    `).join('');
}

function montarLookInteligente() {
    if (roupas.length < 3) {
        alert("Adiciona pelo menos 3 peças primeiro!")
        return
    }
    
    const camisas = roupas.filter(r => r.categoria === 'camisa');
    const calcas = roupas.filter(r => r.categoria === 'calca');
    const sapatos = roupas.filter(r => r.categoria === 'sapato');
    
    if(camisas.length === 0 || calcas.length === 0) {
        alert("Defina pelo menos 1 Camisa e 1 Calça no Guarda-Roupa")
        return
    }

    const camisa = camisas[Math.floor(Math.random() * camisas.length)];
    const calca = calcas[Math.floor(Math.random() * calcas.length)];
    const sapato = sapatos.length > 0? sapatos[Math.floor(Math.random() * sapatos.length)] : null;

    document.getElementById('areaLook').innerHTML = `
        <h3>Seu Look ${document.getElementById('ocasiao').value}</h3>
        <div style="display:flex; justify-content:center; gap:10px">
            <img src="${camisa.src}" width="120">
            <img src="${calca.src}" width="120">
            ${sapato? `<img src="${sapato.src}" width="120">` : ''}
        </div>
    `;
}

carregarGuardaRoupa();
</script>

</body>
</html>
