<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MensVest - Seu Guarda-Roupa Virtual</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
    
    body { 
      font-family: 'Poppins', sans-serif; 
      margin: 0; 
      background: linear-gradient(135deg, #111 0%, #2a2a2a 100%);
      color: white;
      text-align: center; 
      min-height: 100vh;
    }
    header { 
      background: rgba(0,0,0.3); 
      backdrop-filter: blur(10px);
      color: white; 
      padding: 25px; 
      font-size: 28px; 
      font-weight: 700;
      letter-spacing: 2px;
    }
   .btn { 
      background: white; 
      color: #111; 
      padding: 16px 32px; 
      border: none; 
      border-radius: 16px; 
      font-size: 16px; 
      font-weight: 600;
      margin: 10px; 
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,255,255,0.2);
      transition: transform 0.2s;
    }
   .btn:hover { transform: scale(1.05); }
   .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
      gap: 15px; 
      padding: 20px; 
      max-width: 800px;
      margin: 0 auto;
    }
   .item { 
      background: rgba(255,255,255,0.1); 
      border-radius: 16px; 
      padding: 10px;
      backdrop-filter: blur(5px);
    }
   .item img { 
      width: 100%; 
      border-radius: 12px; 
      aspect-ratio: 1/1;
      object-fit: cover;
    }
   .item button {
      background: #ff3b3b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      margin-top: 8px;
      cursor: pointer;
   }
    input[type="file"] { display: none; }
    h2 { font-weight: 600; }
  </style>
</head>
<body>
  <header>MensVest</header>

  <div style="padding: 30px 20px;">
    <h2>Seu Guarda-Roupa Virtual</h2>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
<button class="btn" onclick="document.getElementById('fileInput').click()">+ Adicionar Roupa</button>
